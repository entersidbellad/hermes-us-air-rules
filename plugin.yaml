name: us-air-rules
version: 0.2.0
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.2"
description: "Does this EPA air rule apply to me? Screen a plant or a household against Title 40 of the CFR (eCFR) and recent Federal Register actions, and compare two plant scenarios with the same bundled pack. Applicability triage with citations, not a compliance determination. No API key."
author: entersidbellad
license: MIT
homepage: https://github.com/entersidbellad/hermes-us-air-rules
tags: [epa, air, cfr, ecfr, federal-register, environment, compliance, government-data]
provides_tools:
  - usair_cfr_get
  - usair_cfr_search
  - usair_fr_recent
  - usair_plant_triage
  - usair_plant_compare
  - usair_home_check
  - usair_sip_lookup
provides_hooks: []
config_schema:
  cache_max_mb:
    type: int
    default: 100
    label: "Cache size limit (MB)"
    description: "Oldest cached eCFR and Federal Register responses are deleted past this size."
  fr_on_triage_max:
    type: int
    default: 4
    label: "Federal Register attempts per triage"
    description: "When include_fr is set, at most this many Federal Register requests are attempted during one plant triage. A failed request counts."
